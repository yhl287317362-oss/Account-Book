<!DOCTYPE html>
<html lang="zh-CN" data-theme="ocean">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5aa9e6">
<title>记一笔</title>
<style>
/* ============================================================
   记一笔 · 样式表
   ------------------------------------------------------------
   ★ 想换配色      → 改第 ② 节 :root 里的变量，或加一套 html[data-theme]
   ★ 想换主题图    → 在 App 的「设置 → 主题外观」里上传，不用改代码
   ★ 想换分类图标  → 改 app.js 顶部 CATS 里的 i（现在是 emoji）
   ★ 想改主题图分区 → 看第 ⑤ 节开头的分区表（1080 × 4520）
   ============================================================ */


/* ============================================================
   ① 重置
   ============================================================ */
*{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body{
  margin: 0; padding: 0;
  height: 100%;
  background: #e9edf3;
  color: #1f2733;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
               "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
  overflow-x: hidden;              /* 二级页面停在屏幕右侧，别让整页能左右拖 */
}

button{ font-family: inherit; border: 0; background: none; cursor: pointer; color: inherit; }
input, select{ font-family: inherit; }
img{ display: block; }

::-webkit-scrollbar{ width: 0; height: 0; }


/* ============================================================
   ② 配色变量
   ------------------------------------------------------------
   每个主题只需要覆盖这几个变量，加新主题照抄一段改颜色即可。
   --tw 是「整张主题图的宽度」，由 JS 按屏幕宽度实时写入，
       装饰元素靠它算缩放比例，不用你管。
   ============================================================ */
:root{
  --tw: 390px;
  --timgw: 1080;                 /* 主题图的像素宽，JS 按实际上传的图写入；坐标换算靠它 */

  --primary:      #5aa9e6;
  --primary-soft: #e8f4fd;
  --hero-a:       #7cc7ef;
  --hero-b:       #bfe6fa;
  --hero-text:    #ffffff;

  --page:   #f3f5f9;
  --card:   #ffffff;
  --text:   #1f2733;
  --text-2: #6b7684;
  --text-3: #9aa4b2;
  --line:   #edf0f5;

  --income:  #16a34a;
  --expense: #ef4444;

  --theme-img: none;
}

html[data-theme="ocean"]{
  --primary:#5aa9e6; --primary-soft:#e8f4fd;
  --hero-a:#7cc7ef;  --hero-b:#c3e7fa;  --hero-text:#ffffff;
  --page:#f3f8fc;
}
html[data-theme="sunset"]{
  --primary:#f08a5d; --primary-soft:#fdeee6;
  --hero-a:#f6a97e;  --hero-b:#fbd9c4;  --hero-text:#ffffff;
  --page:#fdf7f4;
}
html[data-theme="forest"]{
  --primary:#4f9d69; --primary-soft:#e8f5ec;
  --hero-a:#78bd8d;  --hero-b:#c8e6d1;  --hero-text:#ffffff;
  --page:#f4faf6;
}
html[data-theme="starry"]{
  --primary:#6c6ce5; --primary-soft:#eeeeFD;
  --hero-a:#4b4b9e;  --hero-b:#8f8fd6;  --hero-text:#ffffff;
  --page:#f5f5fb;
}
html[data-theme="minimal"]{
  --primary:#4b5563; --primary-soft:#eef0f3;
  --hero-a:#8a94a6;  --hero-b:#c9d1db;  --hero-text:#ffffff;
  --page:#f4f5f7;
}
/* 自制主题（上传 PNG 后）统一用中性底色，避免和图片打架 */
html[data-theme="custom"]{
  --primary:#5aa9e6; --primary-soft:#e8f4fd;
  --hero-a:#eef3f8;  --hero-b:#dfe8f2;  --hero-text:#1f2733;
  --page:#f4f6f9;
}


/* ============================================================
   ③ 整体骨架
   ============================================================ */
#app{
  position: relative;
  width: 100%;
  max-width: 430px;          /* ★ 电脑上就显示成手机宽度，手机上自然全宽 */
  height: 100vh;
  height: 100dvh;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  background: var(--page);
  overflow: hidden;
}
@media (min-width: 431px){
  body{ padding: 16px 0; }
  #app{
    height: calc(100vh - 32px);
    border-radius: 22px;
    box-shadow: 0 18px 50px rgba(21,34,56,.16);
  }
}

.page{
  display: none;
  flex: 1;
  min-height: 0;
  flex-direction: column;
}
.page.is-on{ display: flex; }

.body-scroll{
  position: relative;              /* 装饰层按它定位 */
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 12px 14px 20px;
}
/* 首页右下角有悬浮按钮，滚到底时别把最后一条压住 */
#bodyHome{ padding-bottom: 92px; }


/* ============================================================
   ④ 首页 · 顶部主题区
   ============================================================ */
.hero{
  position: relative;
  flex: none;                          /* flex:none = 这条永远不动，内容在它下面滚 */
  padding: 13px 14px;                  /* 46 + 13×2 = 72px，正好对上主题图 ① 区的 200 高 */
  background: linear-gradient(165deg, var(--hero-a), var(--hero-b));
  overflow: hidden;
}
/* 注意：主题图怎么切、铺在哪，统一写在上面「⑤ 主题装饰元素」那一段。
   这里不要再写 html.has-theme .hero 的背景规则 —— 会盖掉切图坐标。 */

.hero-top{
  position: relative;
  z-index: 2;
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 10px;
  min-height: 46px;
}

.avatar-btn{
  position: relative;
  width: 46px; height: 46px;
  border-radius: 50%;
  overflow: hidden;
  background: rgba(255,255,255,.55);
  border: 2px solid rgba(255,255,255,.85);
  padding: 0;
  flex: none;
}
/* ★ 这里千万别用 display:flex 居中：flex 会把下面的 img 当成可收缩的 flex item，
   46×46 的圆里被压成 30×40（宽高比 0.75），object-fit:cover 再按宽度裁一刀，
   手机上看到的就是「圆被切掉了左右两边」。所以图片和占位符都用绝对定位铺满。 */
.avatar{
  position: absolute; left: 0; top: 0;
  display: block;
  width: 100%; height: 100%;
  object-fit: cover;
  border-radius: 50%;
}
.avatar-ph{
  position: absolute; left: 0; top: 0;
  display: flex; align-items: center; justify-content: center;
  width: 100%; height: 100%;
  font-size: 24px; line-height: 1;
}
/* ★ 必须显式写死：作者样式里的 img{display:block} 虽然权重低，但作者样式整体优先于
   浏览器默认的 [hidden]{display:none} —— 不写这行，没传头像时那个空 img 也会占位。 */
.avatar[hidden], .avatar-ph[hidden]{ display: none; }

.greet{ min-width: 0; }
.greet-hi{
  font-size: 18px; font-weight: 700; letter-spacing: .3px;
  color: var(--hero-text);
  text-shadow: 0 1px 3px rgba(0,0,0,.10);
}
.greet-quote{
  margin-top: 3px;
  font-size: 11.5px; line-height: 1.4;
  color: var(--hero-text);
  opacity: .92;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  text-shadow: 0 1px 3px rgba(0,0,0,.10);
}

.theme-btn{
  flex: none;
  display: flex; align-items: center; gap: 3px;
  height: 28px; padding: 0 10px;
  border-radius: 14px;
  background: rgba(255,255,255,.72);
  color: #2b3a4a;
  font-size: 12px; font-weight: 600;
  backdrop-filter: blur(6px);
}
.tb-arrow{ font-size: 9px; opacity: .7; }

/* 今日 / 本月 收支卡（在滚动区里，跟着内容一起滚） */
.sum-card{
  position: relative;
  z-index: 2;
  margin-top: 0;
  padding: 15px 18px 16px;
  border-radius: 18px;
  background: var(--card);
  box-shadow: 0 8px 22px rgba(31,55,86,.10);
  margin-bottom: 12px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 12px;
}
.sum-col{ min-width: 0; }
.sum-col:last-child{ text-align: right; }
.sum-label{ font-size: 11.5px; color: var(--text-3); }
.sum-num{
  margin-top: 4px;
  font-size: 22px; font-weight: 700; letter-spacing: -.2px;
  color: var(--text);
}
.sum-num::before{ content: '¥'; font-size: 13px; font-weight: 600; margin-right: 2px; opacity: .55; }
.sum-sub{ margin-top: 3px; font-size: 11px; color: var(--text-3); }
.sum-line{
  width: 1px; height: 34px;
  background: var(--line);
  flex: none;
}


/* ============================================================
   ⑤ 主题图（上传自制 PNG 后才会出现）
   ------------------------------------------------------------
   一张图 = 一个主题。整图固定 1080 宽 × 4520 高，分五块：

       ① 首页顶栏   1080 × 200   左上角 (0,    0)   → 头像/问候/主题那一行
       ② 统计顶栏   1080 × 560   左上角 (0,  200)   → 月份条 + 支出收入 + 总额
       ③ 底部栏     1080 × 160   左上角 (0,  760)   → 底部 Tab 栏整条
       ④ 首页装饰层 1080 × 1800  左上角 (0,  920)   → 整层浮在首页内容上方
       ⑤ 统计装饰层 1080 × 1800  左上角 (0, 2720)   → 整层浮在统计页内容上方

   ★ ①②③ 是背景条：屏幕上那块多高，就显示图上对应的那一截。
     高度已按手机算好（首页顶栏 72px、统计顶栏 202px、底栏 58px），
     画出来什么样屏幕上就什么样，不会出现「画了却只露一半」。
   ★ ④⑤ 是自由装饰层：整块透明底，想画什么画什么（贝壳、海星、云、光斑…）。
     按屏幕宽等比缩放，位置与屏幕一一对应，不会变形。
     屏幕上高 650px（约一整屏），再往下要滚动才看得到。
   ★ 装饰层浮在卡片上方，但点击会穿透（不挡操作）。别压在文字上，或画淡一点。

   缩放：--tw = App 宽度（手机上就是屏宽，约 390px），
         所有坐标都是「图上像素 ÷ 1080 × --tw」，所以图被压缩过也不会错位。
   想挪装饰层的落点 → 只改 #decoHome / #decoStatsLayer 的 background-position。
   ============================================================ */
.deco{ display: none; }        /* 旧版「一块一个小图标」已废弃，这里只留空壳 */

/* ①② 顶部两条背景：首页顶栏 / 统计顶栏 */
html.has-theme .hero,
html.has-theme .stats-top{
  background-image: var(--theme-img);
  background-size: var(--tw) auto;
  background-repeat: no-repeat;
}
html.has-theme .hero     { background-position: 0 0; }                                        /* ① y=0   */
html.has-theme .stats-top{ background-position: 0 calc(var(--tw) * -200 / var(--timgw)); }    /* ② y=200 */

/* ④⑤ 自由装饰层：贴在滚动内容顶部，整层浮在卡片上方 */
.deco-layer{
  position: absolute;
  left: 0; right: 0; top: 0;
  height: calc(var(--tw) * 1800 / var(--timgw));   /* 图上 1800 高 ≈ 屏幕 650px */
  background-image: var(--theme-img);
  background-size: var(--tw) auto;
  background-repeat: no-repeat;
  pointer-events: none;
  z-index: 4;                                      /* 卡片(0) 之上、FAB(6) 之下 */
  display: none;
}
html.has-theme .deco-layer{ display: block; }
#decoHome      { background-position: 0 calc(var(--tw) * -920  / var(--timgw)); }   /* ④ y=920  */
#decoStatsLayer{ background-position: 0 calc(var(--tw) * -2720 / var(--timgw)); }   /* ⑤ y=2720 */

/* ③ 底部 Tab 栏整条背景：铺满整条 Tab 栏，图从 y=760 那一行开始取 */
.deco-footer{
  position: absolute;
  left: 0; right: 0; top: 0; bottom: 0;
  width: 100%; height: 100%;
  background-image: var(--theme-img);
  background-size: var(--tw) auto;
  background-repeat: no-repeat;
  background-position: 0 calc(var(--tw) * -760 / var(--timgw));
  pointer-events: none;
  z-index: 0;
  display: none;
}
html.has-theme .deco-footer{ display: block; }
html.has-theme .tabbar .tab,
html.has-theme .tabbar .tab-txt,
html.has-theme .tabbar .tab-ico{ position: relative; z-index: 1; }


/* ============================================================
   ⑥ 卡片通用
   ============================================================ */
.card{
  position: relative;
  background: var(--card);
  border-radius: 16px;
  padding: 14px;
  margin-bottom: 12px;
  box-shadow: 0 2px 10px rgba(31,55,86,.05);
}
.card-head{
  position: relative;
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 12px;
  min-height: 20px;
}
.card-title{
  font-size: 14px; font-weight: 700; color: var(--text);
  display: flex; align-items: center; gap: 5px;
}
.card-count{ font-size: 11px; color: var(--text-3); }
.card-more{
  margin-left: auto;
  font-size: 12px; color: var(--primary); font-weight: 600;
  padding: 2px 0 2px 6px;
}

.empty{
  padding: 26px 0;
  text-align: center;
  font-size: 12.5px; line-height: 1.9;
  color: var(--text-3);
}
.empty-ico{ display: block; font-size: 26px; margin-bottom: 6px; opacity: .55; }


/* ============================================================
   ⑦ 首页 · 最近常用
   ============================================================ */
.quick-row{
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}
.quick-item{
  display: flex; flex-direction: column; align-items: center;
  padding: 10px 4px 9px;
  border-radius: 13px;
  background: var(--page);
  transition: transform .12s;
}
.quick-item:active{ transform: scale(.95); }
.quick-ico{
  width: 34px; height: 34px; border-radius: 11px;
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; margin-bottom: 6px;
}
.quick-name{
  font-size: 11px; color: var(--text-2); max-width: 100%;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.quick-amt{ font-size: 10.5px; color: var(--text-3); margin-top: 2px; }
.quick-empty{
  grid-column: 1 / -1;
  padding: 14px 0; text-align: center;
  font-size: 12px; color: var(--text-3);
}


/* ============================================================
   ⑧ 首页 · 流水（整页一起滚，首页只展示最新 8 条）
   ------------------------------------------------------------
   原来这里是个独立滚动的小窗口（max-height + overscroll-behavior:contain），
   结果手指在流水里往上滑时会被 contain 挡住、翻不动整页，体验很糟。
   现在取消内滚：流水就是普通内容，跟着整页一起滑，
   反正「更多」里有全量 + 搜索 + 按时间段筛。
   想改首页显示几条 → 改 app.js 里 renderRecList 的 LIMIT。
   ============================================================ */
.card-flow{ padding-bottom: 8px; }
.flow-hint{
  padding: 9px 0 6px;
  text-align: center;
  font-size: 11px;
  color: var(--text-3);
  border-top: 1px dashed var(--line);
  margin-top: 4px;
}

.day-head{
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 2px 6px;
  font-size: 11.5px; color: var(--text-3);
}
.day-sum{ color: var(--text-3); }

.rec{
  display: flex; align-items: center; gap: 10px;
  padding: 9px 2px;
  border-radius: 10px;
  transition: background .12s;
}
.rec:active{ background: var(--page); }
.rec-ico{
  width: 36px; height: 36px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; flex: none;
}
.rec-main{ flex: 1; min-width: 0; }
.rec-title{
  font-size: 13.5px; color: var(--text); font-weight: 500;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.rec-sub{
  margin-top: 2px;
  font-size: 10.5px; color: var(--text-3);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.rec-note{
  margin-top: 2px;
  font-size: 10.5px; color: var(--text-3);
  background: var(--page);
  display: inline-block;
  padding: 1px 6px;
  border-radius: 5px;
  max-width: 100%;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.rec-amt{
  font-size: 14px; font-weight: 700; color: var(--text);
  flex: none;
}
.rec-amt.income{ color: var(--income); }


/* ============================================================
   ⑨ 悬浮 “+”
   ============================================================ */
.fab{
  position: absolute;
  right: 18px; bottom: 74px;
  z-index: 6;
  width: 54px; height: 54px;
  border-radius: 50%;
  background: var(--primary);
  color: #fff;
  font-size: 28px; font-weight: 300; line-height: 1;
  display: flex; align-items: center; justify-content: center;
  padding-bottom: 3px;
  box-shadow: 0 8px 20px rgba(31,55,86,.26);
  transition: transform .14s;
}
.fab:active{ transform: scale(.92); }


/* ============================================================
   ⑩ 底部 Tab
   ============================================================ */
.tabbar{
  position: relative;
  flex: none;
  height: 58px;
  display: flex;
  background: var(--card);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
  overflow: hidden;
}
.tab{
  flex: 1;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px;
  color: var(--text-3);
  transition: color .16s;
}
.tab-ico{ font-size: 19px; line-height: 1; filter: grayscale(1); opacity: .65; transition: all .16s; }
.tab-txt{ font-size: 10.5px; font-weight: 500; }
.tab.is-on{ color: var(--primary); }
.tab.is-on .tab-ico{ filter: none; opacity: 1; transform: translateY(-1px); }


/* ============================================================
   ⑪ 统计页
   ============================================================ */
.stats-top{
  flex: none;
  padding: 12px 16px 34px;
  background: linear-gradient(165deg, var(--hero-a), var(--hero-b));
  color: var(--hero-text);
  border-radius: 0 0 20px 20px;
}
/* 统计页顶部的主题背景同样由上面「⑤ 主题装饰元素」那段统一管 */
.month-nav-bar{
  display: grid;
  grid-template-columns: 30px 1fr 30px;
  align-items: center;
}
.mn-btn{
  font-size: 20px; line-height: 1;
  height: 28px; border-radius: 8px;
  color: var(--hero-text);
}
.mn-title{
  text-align: center;
  font-size: 14px; font-weight: 600;
  color: var(--hero-text);
}
.seg{
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  gap: 3px;
  padding: 3px;
  border-radius: 11px;
  background: rgba(255,255,255,.28);
}
.seg button{
  height: 30px;
  border-radius: 8px;
  font-size: 13px; font-weight: 600;
  color: var(--hero-text);
  opacity: .85;
  transition: all .16s;
}
.seg button.is-on{
  background: var(--card);
  color: var(--text);
  opacity: 1;
  box-shadow: 0 1px 4px rgba(0,0,0,.10);
}
.seg-sm{ margin-top: 12px; width: 140px; margin-left: auto; }

.stats-total{ margin-top: 16px; }
.st-label{ font-size: 12px; opacity: .88; }
.st-num{
  margin-top: 3px;
  font-size: 30px; font-weight: 700; letter-spacing: -.5px;
}

#pageStats .body-scroll{
  margin-top: -22px;
  padding-top: 0;
}
#pageStats .body-scroll::before{
  content: '';
  display: block;
  height: 22px;
}

/* 环形图 */
.donut-wrap{
  position: relative;
  width: 150px; height: 150px;
  margin: 6px auto 16px;
}
.donut{ width: 100%; height: 100%; transform: rotate(-90deg); }
.donut-center{
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  pointer-events: none;
}
.dc-label{ font-size: 11px; color: var(--text-3); }
.dc-num{ font-size: 17px; font-weight: 700; color: var(--text); margin-top: 2px; }

.cat-list{ display: flex; flex-direction: column; gap: 10px; }
.cat-row{ display: flex; align-items: center; gap: 9px; }
.cat-ico{
  width: 28px; height: 28px; border-radius: 9px;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; flex: none;
}
.cat-name{ font-size: 12.5px; color: var(--text); width: 40px; flex: none; }
.cat-bar{
  flex: 1; height: 6px; border-radius: 3px;
  background: var(--line);
  overflow: hidden;
}
.cat-bar i{ display: block; height: 100%; border-radius: 3px; }
.cat-pct{ font-size: 11px; color: var(--text-3); width: 42px; text-align: right; flex: none; }
.cat-amt{ font-size: 12.5px; font-weight: 600; color: var(--text); width: 66px; text-align: right; flex: none; }

/* 柱状图
   .chart-box 高 148：上面留 20 给数字标签，下面留 20 给日期标签
   .bars 的 gap 决定柱子的胖瘦：每天的柱子多，所以间距要小 */
.chart-box{ height: 148px; padding-top: 20px; }
.bars{
  display: flex; align-items: flex-end; gap: 2px;
  height: 100%;
  padding-bottom: 20px;
  position: relative;
}
.bar-col{
  flex: 1;
  display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
  height: 100%;
  position: relative;
}
.bar-fill{
  width: 100%;
  max-width: 26px;
  border-radius: 5px 5px 3px 3px;
  background: var(--primary);
  min-height: 2px;
  transition: height .3s;
}
.bar-fill.is-zero{ background: var(--line); }
.bar-val{
  position: absolute;
  left: 0; right: 0;
  text-align: center;
  font-size: 9px; color: var(--text-3);
  white-space: nowrap;
}
.bar-lab{
  position: absolute;
  bottom: -17px; left: 0; right: 0;
  text-align: center;
  font-size: 9.5px; color: var(--text-3);
  white-space: nowrap;
}
.chart-empty{ padding: 40px 0; text-align: center; font-size: 12px; color: var(--text-3); }

/* 排行 */
.rank-list{ display: flex; flex-direction: column; }
.rank-item{
  display: flex; align-items: center; gap: 10px;
  padding: 9px 0;
  border-bottom: 1px solid var(--line);
}
.rank-item:last-child{ border-bottom: 0; }
.rank-no{
  width: 18px; height: 18px; border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-size: 10.5px; font-weight: 700;
  background: var(--page); color: var(--text-3);
  flex: none;
}
.rank-item:nth-child(1) .rank-no{ background: #fff3d6; color: #c98a12; }
.rank-item:nth-child(2) .rank-no{ background: #eef1f5; color: #7b8798; }
.rank-item:nth-child(3) .rank-no{ background: #fbe9dd; color: #b4713f; }
.rank-main{ flex: 1; min-width: 0; }
.rank-title{
  font-size: 13px; color: var(--text);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.rank-sub{ font-size: 10.5px; color: var(--text-3); margin-top: 2px; }
.rank-amt{ font-size: 13.5px; font-weight: 700; color: var(--text); flex: none; }


/* ============================================================
   ⑫ 设置页
   ============================================================ */
.set-top{
  flex: none;
  padding: 16px 18px 14px;
  font-size: 20px; font-weight: 700;
  color: var(--text);
  background: var(--card);
  border-bottom: 1px solid var(--line);
}
.set-row{
  display: flex; align-items: center; gap: 10px;
  padding: 12px 2px;
  border-bottom: 1px solid var(--line);
  cursor: pointer;
}
.set-row:last-child{ border-bottom: 0; }
.set-row:active{ background: var(--page); }
.set-ico{ font-size: 16px; width: 22px; text-align: center; flex: none; }
.set-name{ font-size: 13.5px; color: var(--text); flex: 1; }
.set-val{ font-size: 12px; color: var(--text-3); }
.set-row.is-danger .set-name,
.set-row.is-danger .set-val{ color: #e05252; }

.theme-grid{
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 9px;
  margin-bottom: 12px;
}
.theme-item{
  position: relative;
  border-radius: 12px;
  overflow: hidden;
  border: 2px solid transparent;
  background: var(--page);
  text-align: center;
  padding: 0 0 6px;
}
.theme-item.is-on{ border-color: var(--primary); }
.theme-swatch{
  height: 46px;
  background: linear-gradient(160deg, var(--sw-a), var(--sw-b));
  position: relative;
  overflow: hidden;
}
.theme-swatch img{ width: 100%; height: 100%; object-fit: cover; }
.theme-name{
  font-size: 11px; color: var(--text-2);
  margin-top: 5px;
  padding: 0 3px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.theme-item.is-on .theme-name{ color: var(--primary); font-weight: 600; }
.theme-del{
  position: absolute;
  right: 3px; top: 3px;
  width: 17px; height: 17px; border-radius: 50%;
  background: rgba(0,0,0,.42);
  color: #fff; font-size: 10px; line-height: 1;
  display: flex; align-items: center; justify-content: center;
}
.theme-tag{
  position: absolute; left: 3px; top: 3px;
  font-size: 9px; padding: 1px 5px;
  border-radius: 5px;
  background: rgba(0,0,0,.42);
  color: #fff;
}

.btn-line{
  width: 100%;
  height: 40px;
  border-radius: 11px;
  border: 1px dashed var(--line);
  font-size: 13px; color: var(--primary); font-weight: 600;
  transition: background .14s;
}
.btn-line:active{ background: var(--primary-soft); }
.btn-line.is-solid{
  border: 0;
  background: var(--primary);
  color: #fff;
}
.tip{
  margin-top: 10px;
  font-size: 11px; line-height: 1.7;
  color: var(--text-3);
}
.tip b{ color: var(--text-2); }
.tip code{
  background: var(--page);
  padding: 1px 4px; border-radius: 4px;
  font-size: 10.5px;
}
.about{
  padding: 6px 4px 20px;
  text-align: center;
  font-size: 11px; line-height: 1.9;
  color: var(--text-3);
}


/* ============================================================
   ⑬ 二级页面
   ============================================================ */
.sub{
  position: absolute;
  inset: 0;
  z-index: 20;
  background: var(--page);
  display: flex;
  flex-direction: column;
  transform: translateX(100%);
  transition: transform .26s cubic-bezier(.3,.8,.3,1);
  visibility: hidden;
}
.sub.is-on{ transform: translateX(0); visibility: visible; }

.sub-head{
  flex: none;
  height: 52px;
  display: grid;
  grid-template-columns: 44px 1fr auto;
  align-items: center;
  padding: 0 8px;
  background: var(--card);
  border-bottom: 1px solid var(--line);
}
.sub-back{
  font-size: 26px; line-height: 1; color: var(--text);
  height: 40px; border-radius: 10px;
}
.sub-title{ font-size: 15.5px; font-weight: 700; text-align: center; color: var(--text); }
.sub-count{ font-size: 11.5px; color: var(--text-3); padding-right: 8px; }
.sub-add{
  font-size: 13px; font-weight: 600; color: var(--primary);
  padding: 6px 10px; border-radius: 9px;
}
.sub-body{
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 12px 14px 20px;
}
.sub-sum{
  flex: none;
  padding: 10px 18px calc(10px + env(safe-area-inset-bottom));
  background: var(--card);
  border-top: 1px solid var(--line);
  font-size: 12.5px;
  color: var(--text-2);
  display: flex; justify-content: space-between;
}

/* 筛选栏 */
.filter-bar{
  flex: none;
  padding: 10px 14px 11px;
  background: var(--card);
  border-bottom: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 8px;
}
.f-input, .f-sel, .f-date{
  height: 34px;
  padding: 0 10px;
  border-radius: 9px;
  border: 1px solid var(--line);
  background: var(--page);
  font-size: 12.5px; color: var(--text);
  outline: none;
}
.f-input{ width: 100%; }
.f-row{ display: flex; align-items: center; gap: 6px; }
.f-row .f-sel{ flex: none; }
.f-date{ flex: 1; min-width: 0; padding: 0 6px; }
.f-tilde{ font-size: 12px; color: var(--text-3); }
.f-reset{
  flex: none; height: 34px; padding: 0 12px;
  border-radius: 9px; background: var(--page);
  font-size: 12.5px; color: var(--text-2);
}
.f-chip{
  flex: 1; height: 30px;
  border-radius: 9px;
  background: var(--page);
  font-size: 12px; color: var(--text-2);
  border: 1px solid transparent;
}
.f-chip.is-on{
  background: var(--primary-soft);
  color: var(--primary);
  font-weight: 600;
  border-color: var(--primary);
}

/* 激励池 */
.quote-note{
  flex: none;
  padding: 9px 18px;
  font-size: 11px; line-height: 1.6;
  color: var(--text-3);
  background: var(--card);
  border-bottom: 1px solid var(--line);
}
.quote-item{
  display: flex; align-items: center; gap: 10px;
  padding: 11px 12px;
  background: var(--card);
  border-radius: 12px;
  margin-bottom: 8px;
}
.quote-item.is-off{ opacity: .45; }
.quote-item.is-mine{ border-left: 3px solid var(--primary); }
.quote-txt{
  flex: 1;
  font-size: 13px; line-height: 1.5;
  color: var(--text);
  word-break: break-all;
}
.quote-tag{
  font-size: 9.5px; padding: 1px 5px;
  border-radius: 5px;
  background: var(--primary-soft);
  color: var(--primary);
  flex: none;
}
.quote-del{
  width: 26px; height: 26px; border-radius: 8px;
  color: var(--text-3); font-size: 14px;
  flex: none;
}
.switch{
  width: 42px; height: 25px;
  border-radius: 13px;
  background: var(--line);
  position: relative;
  flex: none;
  transition: background .18s;
}
.switch::after{
  content: '';
  position: absolute;
  left: 2.5px; top: 2.5px;
  width: 20px; height: 20px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 1px 3px rgba(0,0,0,.2);
  transition: transform .18s;
}
.switch.is-on{ background: var(--primary); }
.switch.is-on::after{ transform: translateX(17px); }


/* ============================================================
   ⑭ 记一笔 弹窗
   ============================================================ */
.sheet-layer{
  position: absolute;
  inset: 0;
  z-index: 30;
  display: flex;
  align-items: flex-end;
  pointer-events: none;
  visibility: hidden;
  transition: visibility .28s;
}
.sheet-layer.is-on{ visibility: visible; pointer-events: auto; }
.sheet-mask{
  position: absolute; inset: 0;
  background: rgba(18,26,38,.42);
  opacity: 0;
  transition: opacity .24s;
}
.sheet{
  position: relative;
  z-index: 1;
  width: 100%;
  max-height: 88%;
  display: flex;
  flex-direction: column;
  background: var(--card);
  border-radius: 20px 20px 0 0;
  transform: translateY(102%);
  transition: transform .28s cubic-bezier(.3,.85,.35,1);
  padding-bottom: env(safe-area-inset-bottom);
}
.sheet-layer.is-on .sheet-mask{ opacity: 1; }
.sheet-layer.is-on .sheet{ transform: translateY(0); }

.sheet-head{
  flex: none;
  display: grid;
  grid-template-columns: 1fr auto 1fr;   /* 中间那列 auto，保证切换器恒定居中 */
  align-items: center;
  padding: 14px 14px 6px;
}
.sheet-head .seg{ width: 156px; background: var(--page); }
.sheet-head .seg button{ color: var(--text-2); }
.sheet-head .seg button.is-on{ background: var(--card); color: var(--text); }
.sheet-x{
  grid-column: 3;
  justify-self: end;
  width: 32px; height: 32px;
  border-radius: 50%;
  background: var(--page);
  color: var(--text-2);
  font-size: 14px;
  display: flex; align-items: center; justify-content: center;
}

.sheet-body{
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 10px 16px 4px;
}

.entry-input{
  width: 100%;
  height: 48px;
  border: 0;
  border-bottom: 2px solid var(--line);
  background: none;
  font-size: 17px;
  color: var(--text);
  outline: none;
  transition: border-color .16s;
}
.entry-input::placeholder{ color: var(--text-3); font-size: 16px; }
.entry-input:focus{ border-bottom-color: var(--primary); }

.entry-tools{
  display: flex; align-items: center; gap: 8px;
  padding: 10px 0 2px;
}
.tool-btn{
  height: 32px; padding: 0 12px;
  border-radius: 10px;
  background: var(--page);
  font-size: 12.5px; color: var(--text-2);
  display: flex; align-items: center; gap: 4px;
}
.tool-btn:active{ background: var(--primary-soft); color: var(--primary); }

.note-row{
  display: none;
  padding-top: 9px;
}
.note-row.is-on{ display: block; }
.note-input{
  width: 100%;
  height: 38px;
  padding: 0 12px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--page);
  font-size: 13px; color: var(--text);
  outline: none;
}
.note-input:focus{ border-color: var(--primary); }

.parse-row{
  display: flex; align-items: center; gap: 10px;
  padding: 14px 0 4px;
}
.parse-chip{
  display: flex; align-items: center; gap: 5px;
  height: 34px; padding: 0 12px;
  border-radius: 11px;
  background: var(--page);
  color: var(--text-2);
  font-size: 13px; font-weight: 600;
  transition: all .16s;
}
.parse-chip.is-guessed{
  background: var(--primary-soft);
  color: var(--primary);
}
.pc-ico{ font-size: 14px; }
.pc-arrow{ font-size: 9px; opacity: .6; }
.parse-amt{
  margin-left: auto;
  font-size: 19px; font-weight: 700;
  color: var(--text);
}
.parse-amt.is-empty{ color: var(--text-3); font-size: 14px; font-weight: 500; }

.cat-pills{
  display: none;
  flex-wrap: wrap; gap: 7px;
  padding: 12px 0 6px;
}
.cat-pills.is-on{ display: flex; }
.pill{
  height: 32px; padding: 0 12px;
  border-radius: 16px;
  background: var(--page);
  font-size: 12.5px; color: var(--text-2);
  display: flex; align-items: center; gap: 4px;
  border: 1px solid transparent;
}
.pill.is-on{
  background: var(--primary-soft);
  color: var(--primary);
  border-color: var(--primary);
  font-weight: 600;
}
.pi{ font-size: 13px; }

.sheet-foot{
  flex: none;
  display: flex; gap: 10px;
  padding: 12px 16px calc(14px + env(safe-area-inset-bottom));
  border-top: 1px solid var(--line);
}
.btn-save{
  flex: 1;
  height: 46px;
  border-radius: 13px;
  background: var(--line);
  color: var(--text-3);
  font-size: 15.5px; font-weight: 700;
  transition: all .18s;
}
.btn-save.is-ready{
  background: var(--primary);
  color: #fff;
  box-shadow: 0 6px 16px rgba(31,55,86,.18);
}
.btn-del{
  flex: none;
  width: 88px;
  height: 46px;
  border-radius: 13px;
  background: #fdecec;
  color: #e05252;
  font-size: 14.5px; font-weight: 600;
}


/* ============================================================
   ⑮ 浮层
   ============================================================ */
.pop-layer{
  position: absolute;
  inset: 0;
  z-index: 40;
  display: flex;
  align-items: flex-end;
  pointer-events: none;
  visibility: hidden;              /* 关着的时候彻底不参与渲染，别露在屏幕外 */
  transition: visibility .26s;
}
.pop-mask{
  position: absolute; inset: 0;
  background: rgba(18,26,38,.42);
  opacity: 0;
  transition: opacity .22s;
}
.pop{
  position: relative;
  z-index: 1;
  width: 100%;
  max-height: 70%;
  display: flex; flex-direction: column;
  background: var(--card);
  border-radius: 20px 20px 0 0;
  transform: translateY(102%);
  transition: transform .26s cubic-bezier(.3,.85,.35,1);
  padding-bottom: env(safe-area-inset-bottom);
}
.pop-sm{ max-height: none; }
.pop-layer.is-on{ visibility: visible; pointer-events: auto; }
.pop-layer.is-on .pop-mask{ opacity: 1; }
.pop-layer.is-on .pop{ transform: translateY(0); }

.pop-head{
  flex: none;
  display: flex; align-items: center; justify-content: space-between;
  padding: 15px 18px 10px;
  font-size: 15px; font-weight: 700; color: var(--text);
}
.pop-x{
  width: 30px; height: 30px; border-radius: 50%;
  background: var(--page); color: var(--text-2);
  font-size: 13px;
  display: flex; align-items: center; justify-content: center;
}
.pop-body{
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 4px 16px calc(18px + env(safe-area-inset-bottom));
}
.ask-input{
  width: 100%;
  height: 44px;
  padding: 0 13px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--page);
  font-size: 14px; color: var(--text);
  outline: none;
  margin-bottom: 12px;
}
.ask-input:focus{ border-color: var(--primary); }

.theme-list{ display: flex; flex-direction: column; gap: 8px; }
.theme-row{
  display: flex; align-items: center; gap: 11px;
  padding: 10px;
  border-radius: 13px;
  background: var(--page);
  border: 2px solid transparent;
}
.theme-row.is-on{ border-color: var(--primary); background: var(--primary-soft); }
.theme-dot{
  width: 38px; height: 38px; border-radius: 11px;
  background: linear-gradient(160deg, var(--sw-a), var(--sw-b));
  flex: none;
  overflow: hidden;
}
.theme-dot img{ width: 100%; height: 100%; object-fit: cover; }
.theme-row-name{ flex: 1; font-size: 13.5px; color: var(--text); font-weight: 500; }
.theme-check{ color: var(--primary); font-size: 15px; }


/* ============================================================
   ⑯ 提示条
   ============================================================ */
.toast{
  position: fixed;
  left: 50%; top: 50%;
  transform: translate(-50%,-50%) scale(.9);
  z-index: 60;
  max-width: 76%;
  padding: 12px 18px;
  border-radius: 13px;
  background: rgba(24,32,44,.90);
  color: #fff;
  font-size: 13.5px;
  line-height: 1.5;
  text-align: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s, transform .2s;
  display: flex; align-items: center; gap: 12px;
}
.toast.is-on{
  opacity: 1;
  transform: translate(-50%,-50%) scale(1);
}
.toast.has-undo{ pointer-events: auto; }
.toast .undo{
  color: #7cc7ef;
  font-size: 13.5px; font-weight: 700;
  padding: 2px 4px;
  border-left: 1px solid rgba(255,255,255,.25);
  padding-left: 12px;
}

<div id="app">

  <!-- ══════════════════ 首页 ══════════════════ -->

    <div class="hero">

          <span id="themeName">海洋主题</span>
          <span class="tb-arrow">▾</span>
        </button>
      </div>

    <!-- 可滚动主体：今日/本月收支、最近常用、流水都在里面，一起滚 -->
    <div class="body-scroll" id="bodyHome">

      <div class="deco-layer" id="decoHome"></div>

      <div class="sum-card">

          <div class="sum-label">今日支出</div>

      <div class="card card-flow">
        <div class="card-head">
          <span class="card-title">流水</span>
          <span class="card-count" id="recCount"></span>
          <button class="card-more" id="btnMoreRec">更多 ›</button>
        </div>
        <div id="recList"></div>
        <div class="flow-hint" id="flowHint" hidden></div>
      </div>

    </div>

    <button class="fab" id="btnAdd" aria-label="记一笔"><span class="fab-plus">+</span></button>

  </section>

  <!-- ══════════════════ 统计 ══════════════════ -->
  <section class="page" id="pageStats">

    <div class="stats-top">
      <div class="month-nav-bar">
        <button class="mn-btn" id="stPrev" aria-label="上个月">‹</button>
        <span class="mn-title" id="stTitle">—</span>

/* ────────────────────────────────────────────────────────────
   ④ 把「火车票 331元」这样一句话，拆成 金额 / 事项 / 分类
   ──────────────────────────────────────────────────────────── */
const NUM = '\\d+(?:\\.\\d+)?';

function parseEntry(text){
  const raw = String(text == null ? '' : text).trim();
  if(!raw) return { amount: null, title: '', cat: null };

  // 1) 先找带单位的金额：「¥331」「331元」「331 块」，这种最不含糊
  const unit = raw.match(new RegExp('[¥￥]\\s*(' + NUM + ')'))
            || raw.match(new RegExp('(' + NUM + ')\\s*(?:元|块钱|块|圆)'));

  // 2) 没有单位就取最后一个数字（「9.25青旅33」→ 33，金额一般写在后面）
  const all = raw.match(new RegExp(NUM, 'g')) || [];
  const hit = unit ? unit[1] : (all.length ? all[all.length - 1] : null);

  let title = raw;
  let amount = null;

  if(hit !== null){
    const v = Math.round(parseFloat(hit) * 100) / 100;
    if(v > 0) amount = v;
    if(unit){
      title = raw.replace(unit[0], ' ');
    }else{
      const re = new RegExp('(^|[^\\d.])' + hit.replace(/\./g, '\\.') + '(?![\\d.])');
      title = raw.replace(re, '$1 ');
    }
  }

  title = cleanTitle(title);
  return { amount, title, cat: guessCat(title, 'expense') };
}

function cleanTitle(s){
  return String(s)
    .replace(/[¥￥]/g, ' ')
    .replace(/\s+/g, ' ')
    .replace(/^[ ,，、/|·\-—~:：.]+/, '')
    .replace(/[ ,，、/|·\-—~:：.]+$/, '')
    .trim();
}

function guessCat(text, type){
  const s = String(text == null ? '' : text);
  if(!s) return null;
  const rules = KEYWORDS[type] || [];
  for(let i = 0; i < rules.length; i++){
    const w = rules[i].w;
    for(let j = 0; j < w.length; j++){
      if(s.indexOf(w[j]) >= 0) return rules[i].k;
    }
  }
  return null;
}

function dateText(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  const md = (d.getMonth() + 1) + '月' + d.getDate() + '日';
  const back = n => { const x = new Date(); x.setDate(x.getDate() - n); return ymd(x); };
  if(dateStr === todayStr()) return '今天 · ' + md;
  if(dateStr === back(1))    return '昨天 · ' + md;
  if(dateStr === back(2))    return '前天 · ' + md;
  if(d.getFullYear() !== new Date().getFullYear()) return d.getFullYear() + '年' + md;
  return md;
}
// 按本地时间给不同的问候
function greetWord(){
  const h = new Date().getHours();
  if(h >= 6  && h <= 10) return '早上好！';
  if(h >= 11 && h <= 13) return '中午好！';
  if(h >= 14 && h <= 17) return '下午好！';
  return '晚上好！';               // 18:00 ~ 次日 05:59
}

function customThemes(){
  return DB.themes && Array.isArray(DB.themes) ? DB.themes : (DB.themes = []);
}
function themeName(id){
  const t = THEMES.find(x => x.id === id);
  if(t) return t.n + '主题';
  const c = customThemes().find(x => x.id === id);
  return c ? c.n : '海洋主题';
}
function themeSwatch(id){
  const t = THEMES.find(x => x.id === id);
  if(t) return { a: t.a, b: t.b };
  return { a:'#dfe8f2', b:'#f4f6f9' };
}

// 把整张主题图宽度对齐到 App 宽度，装饰元素靠这个比例切片
function syncTw(){
  const app = $('app');
  if(app) document.documentElement.style.setProperty('--tw', app.clientWidth + 'px');
}

/* 兜底：二级页停在屏幕右侧时会撑出 #app 的滚动区。
   #app 已经是 overflow:hidden（手指拖不动），但 iOS Safari 偶尔会漏，
   所以这里再把 scrollLeft 强行按回 0。 */
function lockHScroll(){
  const app = $('app');
  if(!app) return;
  app.addEventListener('scroll', () => { if(app.scrollLeft) app.scrollLeft = 0; }, { passive:true });
  window.addEventListener('resize', () => { if(app.scrollLeft) app.scrollLeft = 0; });
}

// 主题图只注入一次样式，比塞进 CSS 变量稳（图大了变量会拖慢重绘）
function injectThemeImg(dataUrl){
  let el = document.getElementById('themeImgStyle');
  if(!el){
    el = document.createElement('style');
    el.id = 'themeImgStyle';
    document.head.appendChild(el);
  }
  el.textContent = dataUrl
    ? 'html.has-theme .deco-layer,html.has-theme .hero,html.has-theme .stats-top,' +
      'html.has-theme .deco-footer{background-image:url("' + dataUrl + '");}'
    : '';
}

// 主题图的像素宽：上传时统一缩到 1080；万一图太复杂被压得更小，坐标靠这个换算
function themeImgW(id){
  const c = customThemes().find(x => x.id === id);
  return (c && c.w) || THEME_SPEC.w;
}

function applyTheme(id){
  const custom = !THEMES.some(t => t.id === id);
  document.documentElement.dataset.theme = custom ? 'custom' : id;

  if(custom){
    let data = THEME_IMG_CACHE[id];
    if(data === undefined){ data = Store.get('theme.' + id); THEME_IMG_CACHE[id] = data; }
    if(!data){ toast('这个主题的图片找不到了'); return applyTheme('ocean'); }
    injectThemeImg(data);
    document.documentElement.classList.add('has-theme');
  }else{
    injectThemeImg('');
    document.documentElement.classList.remove('has-theme');
  }

  // 坐标换算要用到「图宽」，写进 CSS 变量（style.css 第 ⑤ 节的 calc 靠它）
  document.documentElement.style.setProperty('--timgw', custom ? themeImgW(id) : THEME_SPEC.w);

  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content', themeSwatch(id).a);

  $('themeName').textContent = themeName(id);

  // 装进 Android 壳之后，顺手把系统状态栏也染成主题色（网页里打开时这段自动跳过）
  try{
    if(window.LedgerNative && LedgerNative.setStatusBar){
      LedgerNative.setStatusBar(themeSwatch(id).a);
    }
  }catch(e){}

  syncTw();
}

function setTheme(id){
  DB.theme = id;
  Store.save();
  applyTheme(id);
  renderThemeGrid();
  renderThemePop();
  toast('已换成「' + themeName(id) + '」');
}

// 上传一张图 → 起个名字 → 变成一套可切换的主题
function handleThemeFile(file){
  if(!file) return;
  const img = new Image();
  const url = URL.createObjectURL(file);

  img.onload = () => {
    URL.revokeObjectURL(url);

    const ratio = img.width / img.height;
    const want  = THEME_SPEC.w / THEME_SPEC.h;

    // 统一缩到宽 1080：分区坐标是按 1080 宽算的，宽度不对装饰就会偏位。
    // 顺带把手机拍的大图压小 —— localStorage 只有几 MB，原图直接塞进去必失败。
    let data = '', W = THEME_SPEC.w;
    try{
      for(const k of [1, 0.75, 0.5]){          // 太大就依次降采样，直到塞得进
        W = Math.round(THEME_SPEC.w * k);
        const cv = document.createElement('canvas');
        cv.width  = W;
        cv.height = Math.round(img.height * (W / img.width));
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        // WebP 既保透明又比 PNG 小得多；浏览器不支持时会自动退回 PNG
        data = cv.toDataURL('image/webp', 0.92);
        if(data.indexOf('data:image/webp') !== 0) data = cv.toDataURL('image/png');
        if(data.length < 2.0 * 1024 * 1024) break;
      }
    }catch(e){ data = ''; }
    if(!data){ toast('这张图处理不了，换一张试试'); return; }
    if(data.length >= 2.0 * 1024 * 1024){ toast('这张图内容太满，压到最小还是存不下手机'); return; }

    askInput('给这套主题起个名字', '', name => {
      const id = 'c' + uid();
      if(!Store.put('theme.' + id, data)){
        toast('图片存不进手机，建议少画点元素再试');
        return;
      }
      customThemes().push({ id: id, n: name || '我的主题', w: W });
      DB.theme = id;
      Store.save();
      THEME_IMG_CACHE[id] = data;
      applyTheme(id);
      renderThemeGrid();
      renderThemePop();
      toast('主题已保存');
      if(Math.abs(ratio - want) > 0.12){
        setTimeout(() => toast('提示：这张图不是 1080×3800，装饰位置可能偏'), 1800);
      }
    });
  };

  img.onerror = () => { URL.revokeObjectURL(url); toast('这张图读不出来'); };
  img.src = url;
}

function removeCustomTheme(id){
  DB.themes = customThemes().filter(t => t.id !== id);
  Store.del('theme.' + id);
  delete THEME_IMG_CACHE[id];
  if(DB.theme === id) DB.theme = 'ocean';
  Store.save();
  applyTheme(DB.theme);
  renderThemeGrid();
  renderThemePop();
  toast('已删除');
}

    spec.zones.map(z =>

    '<b>④⑤ 是自由装饰层</b>：整块透明底，贝壳、海星、云、光斑随便摆，' +
    '会整层浮在卡片上方（点击能穿透，不挡操作）。别压在文字上，或者画淡一点。<br>' +
    '<b>①②③ 是背景条</b>：屏幕那块多高就显示图上对应的那一截，画什么就看到什么，不会只露一半。<br>' +
    '上传时会自动缩到宽 <code>1080</code>（太大还会自动压），尺寸不用自己改。';
}

/* ────────────────────────────────────────────────────────────
   ⑨ 头像
   ──────────────────────────────────────────────────────────── */
function handleAvatarFile(file){
  if(!file) return;
  const img = new Image();
  const url = URL.createObjectURL(file);
  img.onload = () => {
    URL.revokeObjectURL(url);
    const S = 160;                                  // 头像存 160×160 就够，不占地方
    const cv = document.createElement('canvas');
    cv.width = cv.height = S;
    const ctx = cv.getContext('2d');
    const s = Math.min(img.width, img.height);      // 居中裁成正方形
    ctx.drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, S, S);
    const data = cv.toDataURL('image/jpeg', 0.86);
    DB.avatar = data;
    if(!Store.put('avatar', data)) toast('头像太大，没存下');
    Store.save();
    renderAvatar();
    toast('头像换好了');
  };
  img.onerror = () => { URL.revokeObjectURL(url); toast('这张图读不出来'); };
  img.src = url;
}

function renderAvatar(){
  const src = DB.avatar || Store.get('avatar');
  if(src){
    $('avatarImg').src = src;
    $('avatarImg').hidden = false;
    $('avatarPh').hidden = true;
    $('setAvatar').querySelector('.set-ico').innerHTML =
      '<img src="' + src + '" style="width:22px;height:22px;border-radius:50%;object-fit:cover" alt="">';
    $('setAvatarVal').textContent = '已自定义 ›';
  }else{
    $('avatarImg').hidden = true;
    $('avatarPh').hidden = false;
    $('setAvatarVal').textContent = '默认 ›';
  }
}


/* ────────────────────────────────────────────────────────────
   ⑩ 激励池
   ------------------------------------------------------------
   内置 316 条存在 quotes.js，这里只管「关掉哪些」和「自己加了哪些」。
   自己加的排在最前面，方便找。
   ──────────────────────────────────────────────────────────── */
function isOff(text){ return DB.quotes.off.indexOf(text) >= 0; }

function pickQuote(){
  const pool = [];
  QUOTES_BUILTIN.forEach(t => { if(!isOff(t)) pool.push(t); });
  DB.quotes.custom.forEach(q => { if(q.on !== false) pool.push(q.text); });

  if(!pool.length){ curQuote = '激励池被关空了，去设置里打开几条吧'; return; }
  if(pool.length === 1){ curQuote = pool[0]; return; }

  let next = curQuote;
  for(let i = 0; i < 8 && next === curQuote; i++){
    next = pool[Math.floor(Math.random() * pool.length)];
  }
  curQuote = next;
}

function renderQuoteHome(){
  $('greetHi').textContent = greetWord();
  $('greetQuote').textContent = curQuote;
}

function renderQuotePage(){
  const mine = DB.quotes.custom;
  const total = QUOTES_BUILTIN.length + mine.length;
  const onCount = QUOTES_BUILTIN.filter(t => !isOff(t)).length +
                  mine.filter(q => q.on !== false).length;
  $('setQuotesVal').textContent = onCount + ' / ' + total + ' 条 ›';

  const html = [];
  // 自己加的置顶（最新的排最上面，方便一眼看到）
  mine.slice().reverse().forEach(q => {
    html.push(
      '<div class="quote-item is-mine' + (q.on === false ? ' is-off' : '') + '">' +
        '<span class="quote-tag">我的</span>' +
        '<span class="quote-txt">' + esc(q.text) + '</span>' +
        '<button class="quote-del" data-del-quote="' + q.id + '">🗑</button>' +
        '<span class="switch' + (q.on === false ? '' : ' is-on') + '" data-quote-id="' + q.id + '"></span>' +
      '</div>');
  });
  // 内置的
  QUOTES_BUILTIN.forEach(t => {
    const off = isOff(t);
    html.push(
      '<div class="quote-item' + (off ? ' is-off' : '') + '" data-builtin="' + esc(t) + '">' +
        '<span class="quote-txt">' + esc(t) + '</span>' +
        '<span class="switch' + (off ? '' : ' is-on') + '"></span>' +
      '</div>');
  });
  $('quoteList').innerHTML = html.join('');
}

function renderHome(){
  const m = curMonthStr();
  const all = DB.records;
  const recs = all.filter(r => monthOf(r.date) === m);

  const dayExp = all.filter(r => r.date === todayStr() && r.type === 'expense')
                    .reduce((s, r) => s + r.amount, 0);
  const monthExp = recs.filter(r => r.type === 'expense').reduce((s, r) => s + r.amount, 0);
  const monthInc = recs.filter(r => r.type === 'income').reduce((s, r) => s + r.amount, 0);

  $('sumToday').textContent = fmt(dayExp);
  $('sumMonth').textContent = fmt(monthExp);
  $('sumLeft').textContent  = '本月剩余 ¥' + fmt(monthInc - monthExp);

  renderQuick(all);
  renderRecList(recs);
  renderQuoteHome();
}

// 最近常用：从最近记过的里面，按分类去重取 4 个
function renderQuick(all){
  if(!all.length){
    $('quickRow').innerHTML = '<div class="quick-empty">记上几笔，这里会出现你的常用分类</div>';
    return;
  }
  const sorted = all.slice().sort((a, b) => (b.ts || 0) - (a.ts || 0));
  const seen = {}, picks = [];
  for(const r of sorted){
    const key = r.type + '|' + r.cat;
    if(seen[key]) continue;
    seen[key] = 1;
    picks.push(r);
    if(picks.length >= 4) break;
  }

  $('quickRow').innerHTML = picks.map((r, i) => {
    const c = findCat(r.type, r.cat) || { n:'未分类', i:'❓', c:'#94a3b8' };
    return '<button class="quick-item" data-quick="' + i + '">' +
      '<span class="quick-ico" style="background:' + c.c + '1f">' + c.i + '</span>' +
      '<span class="quick-name">' + esc(r.title || c.n) + '</span>' +
      '<span class="quick-amt">' + (r.type === 'income' ? '+' : '-') + fmtShort(r.amount) + '</span>' +
    '</button>';
  }).join('');
  $('quickRow').__picks = picks;
}

function renderRecList(recs){
  const list = recs.slice().sort((a, b) => (b.ts || 0) - (a.ts || 0));
  $('recCount').textContent = list.length ? '共 ' + list.length + ' 笔' : '';

  if(!list.length){
    $('flowHint').hidden = true;
    $('recList').innerHTML =
      '<div class="empty"><span class="empty-ico">🧾</span>这个月还没有记录<br>点右下角「+」记第一笔</div>';
    return;
  }

  const LIMIT = 8;                                 // 首页只看最新 8 条，全量去「更多」
  const show = list.slice(0, LIMIT);
  const rest = list.length - show.length;
  $('flowHint').hidden = rest <= 0;
  if(rest > 0) $('flowHint').textContent = '还有 ' + rest + ' 笔 · 点右上角「更多」看全部';

  const byDay = {};
  show.forEach(r => { (byDay[r.date] = byDay[r.date] || []).push(r); });
  const days = Object.keys(byDay).sort().reverse();

  $('recList').innerHTML = days.map(d => {
    const items = byDay[d];
    const dayExp = items.filter(r => r.type === 'expense').reduce((s, r) => s + r.amount, 0);

    const head = '<div class="day-head">' +
      '<span>' + dayLabel(d) + '</span>' +
      '<span class="day-sum">' + (dayExp ? '支出 ¥' + fmt(dayExp) : '') + '</span>' +
    '</div>';

    return head + items.map(r => recHTML(r)).join('');
  }).join('');
}

function recHTML(r){
  const c = findCat(r.type, r.cat) || { n:'未分类', i:'❓', c:'#94a3b8' };
  const sign = r.type === 'income' ? '+' : '−';
  const sub = (!r.note && r.title) ? ('<div class="rec-sub">' + c.n + '</div>') : '';
  return '<div class="rec" data-id="' + r.id + '">' +
    '<div class="rec-ico" style="background:' + c.c + '1f">' + c.i + '</div>' +
    '<div class="rec-main">' +
      '<div class="rec-title">' + (esc(r.title) || c.n) + '</div>' +
      sub +
      (r.note ? '<div class="rec-note">' + esc(r.note) + '</div>' : '') +
    '</div>' +
    '<div class="rec-amt' + (r.type === 'income' ? ' income' : '') + '">' + sign + fmt(r.amount) + '</div>' +
  '</div>';
}


/* ────────────────────────────────────────────────────────────
   ⑫ 统计页
   ──────────────────────────────────────────────────────────── */
function renderStats(){
  const recs = DB.records.filter(r => monthOf(r.date) === statMonth);
  const isExp = statType === 'expense';

  $('stTitle').textContent = monthText(statMonth);
  $('stLabel').textContent = isExp ? '共支出' : '共收入';
  Array.prototype.forEach.call($('stTypeSeg').children, b => {
    b.classList.toggle('is-on', b.dataset.t === statType);
  });

  const typed = recs.filter(r => r.type === statType);
  const total = typed.reduce((s, r) => s + r.amount, 0);
  $('stTotal').textContent = '¥ ' + fmt(total);

  const rows = CATS[statType].map(c => ({
    ...c,
    amt: typed.filter(r => r.cat === c.k).reduce((s, r) => s + r.amount, 0)
  })).filter(x => x.amt > 0).sort((a, b) => b.amt - a.amt);

  renderDonut(rows, total, isExp);
  renderCatList(rows, total);
  renderDaily(recs, statMonth, isExp);
  renderMonthly(statMonth, statType);
  renderRank(typed, isExp);
}

function renderDonut(rows, total, isExp){
  const R = 46, C = 2 * Math.PI * R;
  $('dcLabel').textContent = isExp ? '总支出' : '总收入';
  $('dcNum').textContent = '¥' + fmtShort(total);

  if(!total){
    $('donut').innerHTML =
      '<circle cx="60" cy="60" r="' + R + '" fill="none" stroke="#eef0f5" stroke-width="13"/>';
    return;
  }

  let acc = 0;
  $('donut').innerHTML = rows.map(r => {
    const len = (r.amt / total) * C;
    const seg = '<circle cx="60" cy="60" r="' + R + '" fill="none" stroke="' + r.c + '"' +
      ' stroke-width="13" stroke-dasharray="' + len.toFixed(2) + ' ' + (C - len).toFixed(2) + '"' +
      ' stroke-dashoffset="' + (-acc).toFixed(2) + '"/>';
    acc += len;
    return seg;
  }).join('');
}

function renderCatList(rows, total){
  if(!rows.length){
    $('stCatList').innerHTML = '<div class="empty" style="padding:14px 0">这个月还没有数据</div>';
    return;
  }
  const max = rows[0].amt;
  $('stCatList').innerHTML = rows.map(r => {
    const pct = total ? (r.amt / total * 100) : 0;
    const w = (r.amt / max * 100).toFixed(1);
    return '<div class="cat-row">' +
      '<span class="cat-ico" style="background:' + r.c + '1f">' + r.i + '</span>' +
      '<span class="cat-name">' + r.n + '</span>' +
      '<span class="cat-bar"><i style="width:' + w + '%;background:' + r.c + '"></i></span>' +
      '<span class="cat-pct">' + pct.toFixed(1) + '%</span>' +
      '<span class="cat-amt">¥' + fmt(r.amt) + '</span>' +
    '</div>';
  }).join('');
}

// 每日对比：这个月每天一根柱
function renderDaily(recs, month, isExp){
  const [y, m] = month.split('-').map(Number);
  const daysInMonth = new Date(y, m, 0).getDate();
  // 看的是本月就只画到今天 —— 后面一堆空柱子既占地又不好看
  const days = (month === curMonthStr()) ? new Date().getDate() : daysInMonth;

  const sums = new Array(days + 1).fill(0);
  recs.filter(r => r.type === (isExp ? 'expense' : 'income'))
      .forEach(r => { const d = Number(String(r.date).slice(8, 10)); if(d >= 1 && d <= days) sums[d] += r.amount; });

  const items = [];
  for(let d = 1; d <= days; d++){
    // 标签太密会挤，隔几天标一个
    const step = days > 20 ? 5 : 3;
    const showLab = (d === 1 || d % step === 0 || d === days);
    items.push({ label: showLab ? (m + '.' + d) : '', value: sums[d] });
  }
  renderBars($('chartDaily'), items, isExp);
}

// 月度对比：往前看 6 个月
function renderMonthly(month, type){
  const items = [];
  for(let i = 5; i >= 0; i--){
    const m = shiftMonthStr(month, -i);
    const v = DB.records
      .filter(r => monthOf(r.date) === m && r.type === type)
      .reduce((s, r) => s + r.amount, 0);
    items.push({ label: Number(m.slice(5, 7)) + '月', value: v });
  }
  renderBars($('chartMonthly'), items, type === 'expense');
}

function renderBars(el, items, isExp){
  const max = Math.max(...items.map(i => i.value));
  if(!max){
    el.innerHTML = '<div class="chart-empty">这段时间没有数据</div>';
    return;
  }
  const color = isExp ? 'var(--primary)' : 'var(--income)';
  // 柱子多的时候每根都标数字会糊成一片，只标最高的那根
  const showAll = items.length <= 8;
  let top = 0;
  items.forEach((it, i) => { if(it.value > items[top].value) top = i; });

  el.innerHTML = '<div class="bars">' + items.map((it, i) => {
    const pct = it.value / max * 100;
    const withVal = it.value > 0 && (showAll || i === top);
    return '<div class="bar-col">' +
      '<div class="bar-fill' + (it.value ? '' : ' is-zero') + '" style="height:' +
        (it.value ? Math.max(pct, 3) : 2) + '%;background:' + (it.value ? color : '') + '"></div>' +
      (withVal ? '<span class="bar-val" style="bottom:calc(' + pct + '% + 3px)">' +
        fmtShort(it.value) + '</span>' : '') +
      '<span class="bar-lab">' + it.label + '</span>' +
    '</div>';
  }).join('') + '</div>';
}

function renderRank(typed, isExp){
  const top = typed.slice().sort((a, b) => b.amount - a.amount).slice(0, 10);
  if(!top.length){
    $('rankList').innerHTML = '<div class="empty" style="padding:14px 0">这个月还没有数据</div>';
    return;
  }
  $('rankList').innerHTML = top.map((r, i) => {
    const c = findCat(r.type, r.cat) || { n:'未分类', i:'❓', c:'#94a3b8' };
    const d = new Date(r.date + 'T00:00:00');
    return '<div class="rank-item">' +
      '<span class="rank-no">' + (i + 1) + '</span>' +
      '<span class="rec-ico" style="background:' + c.c + '1f;width:30px;height:30px;font-size:14px">' + c.i + '</span>' +
      '<div class="rank-main">' +
        '<div class="rank-title">' + (esc(r.title) || c.n) + '</div>' +
        '<div class="rank-sub">' + c.n + ' · ' + (d.getMonth() + 1) + '月' + d.getDate() + '日</div>' +
      '</div>' +
      '<span class="rank-amt">' + (isExp ? '−' : '+') + fmt(r.amount) + '</span>' +
    '</div>';
  }).join('');
}

const filter = { kw:'', range:'all', month:curMonthStr(), from:'', to:'', kind:'all' };

function applyAllFilter(){
  let list = DB.records.slice();

  if(filter.range === 'month' && filter.month){
    list = list.filter(r => monthOf(r.date) === filter.month);
  }else if(filter.range === 'custom'){
    if(filter.from) list = list.filter(r => r.date >= filter.from);
    if(filter.to)   list = list.filter(r => r.date <= filter.to);
  }

  if(filter.kind !== 'all') list = list.filter(r => r.type === filter.kind);

  const kw = filter.kw.trim().toLowerCase();
  if(kw){
    list = list.filter(r =>
      String(r.title || '').toLowerCase().indexOf(kw) >= 0 ||
      String(r.note  || '').toLowerCase().indexOf(kw) >= 0);
  }

  return list.sort((a, b) => (b.date > a.date ? 1 : b.date < a.date ? -1 : (b.ts || 0) - (a.ts || 0)));
}

function renderAllList(){
  const list = applyAllFilter();
  const exp = list.filter(r => r.type === 'expense').reduce((s, r) => s + r.amount, 0);
  const inc = list.filter(r => r.type === 'income').reduce((s, r) => s + r.amount, 0);

  $('allCount').textContent = list.length + ' 笔';
  $('allSum').innerHTML =
    '<span>支出 ¥' + fmt(exp) + '</span><span>收入 ¥' + fmt(inc) + '</span>';

  if(!list.length){
    $('allList').innerHTML = '<div class="empty"><span class="empty-ico">🔍</span>没有符合条件的记录</div>';
    return;
  }

  const byDay = {};
  list.forEach(r => { (byDay[r.date] = byDay[r.date] || []).push(r); });
  const days = Object.keys(byDay).sort().reverse();

  $('allList').innerHTML = days.map(d => {
    const items = byDay[d];
    const dayExp = items.filter(r => r.type === 'expense').reduce((s, r) => s + r.amount, 0);
    return '<div class="day-head">' +
      '<span>' + dayLabel(d) + '</span>' +
      '<span class="day-sum">' + (dayExp ? '支出 ¥' + fmt(dayExp) : '') + '</span>' +
    '</div>' + items.map(r => recHTML(r)).join('');
  }).join('');
}

function resolvedCat(){
  if(catLocked && curCat) return curCat;
  return guessed || (curType === 'income' ? 'otherin' : 'other');
}

function openSheet(rec, preset){
  editingId = rec ? rec.id : null;
  curType   = rec ? rec.type : (preset && preset.type ? preset.type : 'expense');
  curDate   = rec ? rec.date : todayStr();
  curCat    = rec ? rec.cat  : (preset && preset.cat ? preset.cat : null);
  catLocked = !!(rec || (preset && preset.cat));

  if(rec){
    // 已有记录 → 回填成「事项 金额」这一句话，方便直接改
    $('entryInput').value = ((rec.title ? rec.title + ' ' : '') + (Math.round(rec.amount * 100) / 100));
    $('noteInput').value = rec.note || '';
  }else if(preset){
    $('entryInput').value = preset.text || '';
    $('noteInput').value = '';
  }else{
    $('entryInput').value = '';
    $('noteInput').value = '';
  }

  // 有备注就展开那一行
  $('noteRow').classList.toggle('is-on', !!$('noteInput').value);
  $('btnDelete').hidden = !rec;

  $('catPills').classList.remove('is-on');
  renderTypeSeg();
  renderDateRow();
  syncEntry();

  $('sheetLayer').classList.add('is-on');
  $('sheet').scrollTop = 0;
}

function closeSheet(){
  $('sheetLayer').classList.remove('is-on');
  $('catPills').classList.remove('is-on');
  $('entryInput').blur();
  $('noteInput').blur();
  editingId = null;
}

function renderTypeSeg(){
  Array.prototype.forEach.call($('typeSeg').children, b => {
    b.classList.toggle('is-on', b.dataset.type === curType);
  });
}
function renderDateRow(){
  $('dateText').textContent = dateText(curDate);
}

function syncEntry(){
  parsed  = parseEntry($('entryInput').value);
  guessed = guessCat(parsed.title, curType);
  renderParseRow();
  renderCatPills();
}

function renderParseRow(){
  const c = findCat(curType, resolvedCat()) || { n:'其他', i:'📦', c:'#94a3b8' };
  $('parseChip').innerHTML =
    '<span class="pc-ico">' + c.i + '</span>' +
    '<span class="pc-name">' + c.n + '</span>' +
    '<span class="pc-arrow">▾</span>';
  // 高亮 = 有依据（认出来了，或你自己选的）；灰 = 兜底的「其他」
  $('parseChip').classList.toggle('is-guessed', !!guessed || catLocked);

  const amt = $('parseAmt');
  const typing = !!$('entryInput').value.trim();
  if(parsed.amount > 0){
    amt.textContent = '¥ ' + fmt(parsed.amount);
    amt.classList.remove('is-empty');
  }else{
    amt.textContent = typing ? '没识别到金额' : '¥ --';
    amt.classList.add('is-empty');
  }
  $('btnSave').classList.toggle('is-ready', !!(parsed.amount > 0));
}

function renderCatPills(){
  const on = resolvedCat();
  $('catPills').innerHTML = CATS[curType].map(c =>
    '<button class="pill' + (c.k === on ? ' is-on' : '') + '" data-k="' + c.k + '">' +
      '<span class="pi">' + c.i + '</span>' + c.n +
    '</button>'
  ).join('');
}

function saveRecord(){
  if(!(parsed.amount > 0)){
    toast('没识别到金额，比如「火车票 331」');
    $('entryInput').focus();
    return;
  }

  const note    = $('noteInput').value.trim();
  const cat     = resolvedCat();
  const title   = parsed.title;
  const amount  = parsed.amount;
  const wasEdit = !!editingId;

  if(wasEdit){
    const r = DB.records.find(x => x.id === editingId);
    if(r) Object.assign(r, { date: curDate, amount, type: curType, cat, title, note });
  }else{
    DB.records.push({
      id: uid(), date: curDate, amount, type: curType, cat, title, note, ts: Date.now()
    });
  }

  Store.save();
  closeSheet();

  // 刚记的那笔在哪个页面，就刷新哪个
  if(curTab === 'home')     renderHome();
  if(curTab === 'stats')    renderStats();
  if(curTab === 'settings') renderSettings();
  renderAllList();
  toast(wasEdit ? '已保存修改' : '记好了');
}

function deleteRecord(){
  const i = DB.records.findIndex(x => x.id === editingId);
  if(i < 0) return;

  const backup = DB.records[i];
  DB.records.splice(i, 1);
  Store.save();
  closeSheet();
  renderHome();
  renderAllList();

  toastUndo('已删除', () => {          // 4 秒内可撤销
    DB.records.push(backup);
    Store.save();
    renderHome();
    renderAllList();
    toast('已恢复');
  });
}

let toastTimer = null;
let undoAction = null;

function toast(msg, ms){
  const el = $('toast');
  el.textContent = msg;
  el.classList.remove('has-undo');
  el.classList.add('is-on');
  undoAction = null;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('is-on'), ms || 1700);
}

function toastUndo(msg, action){
  const el = $('toast');
  el.innerHTML = '<span>' + msg + '</span><button class="undo">撤销</button>';
  el.classList.add('is-on', 'has-undo');
  undoAction = action;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    el.classList.remove('is-on', 'has-undo');
    undoAction = null;
  }, 4000);
}

/* ────────────────────────────────────────────────────────────
   ⑲ 备份 / 恢复
   ★ [套壳时注意] Android WebView 里 a.download 不生效，
     壳那边要加 DownloadListener（套壳时我会处理）
   ──────────────────────────────────────────────────────────── */
function exportData(){
  const payload = JSON.stringify({
    v: 2,
    exportedAt: new Date().toISOString(),
    records: DB.records,
    quotes: DB.quotes,
    theme: DB.theme
  }, null, 2);

  try{
    const blob = new Blob([payload], { type: 'application/json' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url;
    a.download = '记账备份_' + todayStr() + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
    toast('已导出，去「下载」文件夹看看');
  }catch(e){
    toast('这台设备不支持导出');
  }
}

function importData(file){
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const d = JSON.parse(reader.result);
      if(!d || !Array.isArray(d.records)) throw new Error('bad');

      const map = new Map(DB.records.map(r => [r.id, r]));
      d.records.forEach(r => { if(r && r.id) map.set(r.id, r); });
      DB.records = Array.from(map.values());

      if(d.quotes && Array.isArray(d.quotes.custom)){
        const seen = new Set(DB.quotes.custom.map(q => q.text));
        d.quotes.custom.forEach(q => {
          if(q && q.text && !seen.has(q.text)) DB.quotes.custom.push(q);
        });
      }

      Store.save();
      renderHome(); renderSettings(); renderAllList();
      toast('已导入 ' + d.records.length + ' 条');
    }catch(e){
      toast('这个文件读不了');
    }
  };
  reader.readAsText(file);
}

function watchKeyboard(){
  const vv = window.visualViewport;
  if(!vv) return;
  const apply = () => {
    const gap = window.innerHeight - vv.height - vv.offsetTop;
    $('sheetLayer').style.paddingBottom = gap > 80 ? (gap + 'px') : '';
  };
  vv.addEventListener('resize', apply);
  vv.addEventListener('scroll', apply);
  apply();
}


/* ────────────────────────────────────────────────────────────

function bindEvents(){

  /* 底部 Tab */
  $('tabbar').addEventListener('click', e => {
    const b = e.target.closest('.tab');
    if(b) switchTab(b.dataset.tab);
  });

  /* 首页 —— 问候语旁边的主题按钮 */

  });

    const row = e.target.closest('[data-pick-theme]');
    if(!row) return;
    $('themePop').classList.remove('is-on');
    setTheme(row.dataset.pickTheme);
  });

  /* 首页 —— 点激励语换一条 */
  $('greetQuote').addEventListener('click', () => {
    pickQuote();
    $('greetQuote').textContent = curQuote;
  });

  /* 首页 —— 头像 */
  $('btnAvatar').addEventListener('click', () => $('fileAvatar').click());

  /* 首页 —— 最近常用：点一下直接开记一笔，把上次那句话带上 */
  $('quickRow').addEventListener('click', e => {
    const b = e.target.closest('[data-quick]');
    if(!b) return;
    const picks = $('quickRow').__picks || [];
    const r = picks[Number(b.dataset.quick)];
    if(!r) return;
    openSheet(null, {
      type: r.type,
      cat:  r.cat,
      text: (r.title ? r.title + ' ' : '') + (Math.round(r.amount * 100) / 100)
    });
  });

  /* 首页 —— 点流水改一笔 */
  $('recList').addEventListener('click', e => {
    const el = e.target.closest('.rec');
    if(!el) return;
    const rec = DB.records.find(r => r.id === el.dataset.id);
    if(rec) openSheet(rec);
  });

  /* 全部明细 —— 点一条也能改 */
  $('allList').addEventListener('click', e => {
    const el = e.target.closest('.rec');
    if(!el) return;
    const rec = DB.records.find(r => r.id === el.dataset.id);
    if(rec) openSheet(rec);
  });

  /* 首页 —— 更多 / 打开记一笔 */
  $('btnMoreRec').addEventListener('click', () => {
    renderAllList();
    openSub('subAll');
  });
  $('btnAdd').addEventListener('click', () => openSheet(null));

  /* 二级页面 —— 返回 */
  document.querySelectorAll('.sub').forEach(sub => {
    sub.addEventListener('click', e => {
      if(e.target.closest('[data-back]')) closeSub(sub);
    });
  });

  /* 全部明细 —— 筛选 */
  $('fKeyword').addEventListener('input', e => { filter.kw = e.target.value; renderAllList(); });
  $('fRange').addEventListener('change', e => {
    filter.range = e.target.value;
    $('fMonth').hidden = filter.range !== 'month';
    $('fFrom').hidden = $('fTo').hidden = $('fTilde').hidden = filter.range !== 'custom';
    renderAllList();
  });
  $('fMonth').addEventListener('change', e => { filter.month = e.target.value; renderAllList(); });
  $('fFrom').addEventListener('change',  e => { filter.from = e.target.value; renderAllList(); });
  $('fTo').addEventListener('change',    e => { filter.to = e.target.value; renderAllList(); });
  $('fReset').addEventListener('click', () => {
    filter.kw = ''; filter.range = 'all'; filter.kind = 'all';
    filter.from = ''; filter.to = ''; filter.month = curMonthStr();
    $('fKeyword').value = ''; $('fRange').value = 'all';
    $('fFrom').value = ''; $('fTo').value = ''; $('fMonth').value = filter.month;
    $('fMonth').hidden = true; $('fFrom').hidden = $('fTo').hidden = $('fTilde').hidden = true;
    Array.prototype.forEach.call(document.querySelectorAll('.f-chip'), c =>
      c.classList.toggle('is-on', c.dataset.kind === 'all'));
    renderAllList();
  });
  document.querySelector('.filter-bar').addEventListener('click', e => {
    const chip = e.target.closest('.f-chip');
    if(!chip) return;
    filter.kind = chip.dataset.kind;
    Array.prototype.forEach.call(document.querySelectorAll('.f-chip'), c =>
      c.classList.toggle('is-on', c === chip));
    renderAllList();
  });

  /* 激励池 —— 开关 / 删除 / 新增 */
  $('setQuotes').addEventListener('click', () => {
    renderQuotesPage();
    openSub('subQuotes');
  });
  $('quoteList').addEventListener('click', e => {
    const del = e.target.closest('[data-del-quote]');
    if(del){
      const id = del.dataset.delQuote;
      DB.quotes.custom = DB.quotes.custom.filter(q => q.id !== id);
      Store.save(); renderQuotePage(); toast('已删除');
      return;
    }
    const sw = e.target.closest('.switch');
    if(!sw) return;
    const row = sw.closest('.quote-item');
    if(row.dataset.builtin != null){
      const t = row.dataset.builtin;
      const i = DB.quotes.off.indexOf(t);
      if(i >= 0) DB.quotes.off.splice(i, 1); else DB.quotes.off.push(t);
    }else{
      const q = DB.quotes.custom.find(x => x.id === sw.dataset.quoteId);
      if(q) q.on = (q.on === false);
    }
    Store.save();
    renderQuotePage();
    pickQuote();
    renderQuoteHome();
  });
  $('btnAddQuote').addEventListener('click', () => {
    askInput('新增一条激励语', '', txt => {
      const t = String(txt || '').trim();
      if(!t){ toast('写点什么吧'); return; }
      if(QUOTES_BUILTIN.indexOf(t) >= 0 || DB.quotes.custom.some(q => q.text === t)){
        toast('这条已经有了');
        return;
      }
      DB.quotes.custom.push({ id: uid(), text: t, on: true });
      Store.save();
      renderQuotePage();
      pickQuote();
      renderQuoteHome();
      toast('已添加，会排在激励池最前面');
    });
  });

  /* 设置 —— 主题上传 / 切换 / 删除 */
  $('themeGrid').addEventListener('click', e => {
    const del = e.target.closest('[data-del-theme]');
    if(del){
      if(!confirm('删掉这套自制主题吗？')) return;
      removeCustomTheme(del.dataset.delTheme);
      return;
    }
    const it = e.target.closest('[data-theme-id]');
    if(it) setTheme(it.dataset.themeId);
  });
  $('btnUploadTheme').addEventListener('click', () => $('fileTheme').click());
  $('fileTheme').addEventListener('change', e => {
    const f = e.target.files && e.target.files[0];
    if(f) handleThemeFile(f);
    e.target.value = '';
  });

  /* 设置 —— 头像 / 备份 */
  $('setAvatar').addEventListener('click', () => $('fileAvatar').click());
  $('fileAvatar').addEventListener('change', e => {
    const f = e.target.files && e.target.files[0];
    if(f) handleAvatarFile(f);
    e.target.value = '';
  });
  $('setExport').addEventListener('click', exportData);
  $('setImport').addEventListener('click', () => $('fileImport').click());
  $('fileImport').addEventListener('change', e => {
    const f = e.target.files && e.target.files[0];
    if(f) importData(f);
    e.target.value = '';
  });
  $('setClearDemo').addEventListener('click', () => {
    const n = DB.records.filter(r => r.demo).length;
    if(!n){ toast('没有示例数据了'); return; }
    DB.records = DB.records.filter(r => !r.demo);
    Store.save();
    renderHome(); renderStats(); renderAllList();
    toast('已清掉 ' + n + ' 条示例');
  });

  /* 统计页 —— 月份 / 支出收入切换 */
  $('stPrev').addEventListener('click', () => { statMonth = shiftMonthStr(statMonth, -1); renderStats(); });
  $('stNext').addEventListener('click', () => { statMonth = shiftMonthStr(statMonth,  1); renderStats(); });
  $('stTypeSeg').addEventListener('click', e => {
    const b = e.target.closest('button');
    if(!b) return;
    statType = b.dataset.t;
    renderStats();
  });

  /* 记一笔 */
  $('btnClose').addEventListener('click', closeSheet);
  $('sheetMask').addEventListener('click', closeSheet);
  $('typeSeg').addEventListener('click', e => {
    const btn = e.target.closest('button');
    if(!btn) return;
    curType = btn.dataset.type;
    if(!findCat(curType, curCat)){ curCat = null; catLocked = false; }
    renderTypeSeg();
    syncEntry();
  });
  $('btnDate').addEventListener('click', pickDate);
  $('dateInput').addEventListener('change', () => {
    if($('dateInput').value){ curDate = $('dateInput').value; renderDateRow(); }
  });
  $('entryInput').addEventListener('input', syncEntry);
  $('entryInput').addEventListener('keydown', e => {
    if(e.key === 'Enter'){ e.preventDefault(); saveRecord(); }
  });
  $('btnNote').addEventListener('click', () => {
    const on = !$('noteRow').classList.contains('is-on');
    $('noteRow').classList.toggle('is-on', on);
    if(on) setTimeout(() => $('noteInput').focus(), 60);
  });
  $('noteInput').addEventListener('keydown', e => {
    if(e.key === 'Enter'){ e.preventDefault(); saveRecord(); }
  });
  $('parseChip').addEventListener('click', () => $('catPills').classList.toggle('is-on'));
  $('catPills').addEventListener('click', e => {
    const btn = e.target.closest('.pill');
    if(!btn) return;
    curCat = btn.dataset.k;
    catLocked = true;
    renderParseRow();
    renderCatPills();
  });
  $('btnSave').addEventListener('click', saveRecord);
  $('btnDelete').addEventListener('click', deleteRecord);

  /* 提示条：撤销 */
  $('toast').addEventListener('click', () => {
    if(undoAction){
      const fn = undoAction;
      undoAction = null;
      $('toast').classList.remove('is-on', 'has-undo');
      clearTimeout(toastTimer);
      fn();
    }
  });

  /* 浮层：确定 / 关闭 */
  $('askOk').addEventListener('click', () => {
    const v = $('askInput').value;
    const cb = askCallback;
    closeAsk();
    if(cb) cb(v);
  });
  $('askInput').addEventListener('keydown', e => {
    if(e.key === 'Enter'){ e.preventDefault(); $('askOk').click(); }
  });
  document.querySelectorAll('[data-pop-close]').forEach(el => {
    el.addEventListener('click', () => {
      closeAsk();
      $('themePop').classList.remove('is-on');
    });
  });

  /* 电脑上按 Esc 关掉一切 */
  document.addEventListener('keydown', e => {
    if(e.key !== 'Escape') return;
    if($('askPop').classList.contains('is-on')) return closeAsk();
    if($('themePop').classList.contains('is-on')) return $('themePop').classList.remove('is-on');
    if($('sheetLayer').classList.contains('is-on')) return closeSheet();
    const open = document.querySelector('.sub.is-on');
    if(open) closeSub(open);
  });

  window.addEventListener('resize', syncTw);
  watchKeyboard();
}


/* ────────────────────────────────────────────────────────────
   ㉑ 启动
   ──────────────────────────────────────────────────────────── */
function init(){
  DB = Store.load();
  if(!Array.isArray(DB.themes)) DB.themes = [];

  // 第一次打开：塞几条示例数据，让你先看到完整效果
  if(!DB.seeded){
    DB.seeded = true;
    if(!DB.records.length) DB.records = seedDemo();
    Store.save();
  }

  statMonth = curMonthStr();
  filter.month = statMonth;

  applyTheme(DB.theme);
  bindEvents();
  pickQuote();
  renderHome();
  renderSettings();
  renderAllList();

  $('fMonth').value = statMonth;
  $('fMonth').hidden = true;
  $('fFrom').hidden = $('fTo').hidden = $('fTilde').hidden = true;

  syncTw();
  lockHScroll();
}

init();


/* ────────────────────────────────────────────────────────────
   ㉒ Android 返回键
   ------------------------------------------------------------
   装进 Android 壳之后，物理返回键 / 侧滑返回会调用这个函数。
   顺序是「从最上层的浮层往下退」：
       提示框 → 主题浮层 → 记一笔弹窗 → 二级页 → 非首页 tab
   全都没得退就返回 false，交给原生把 App 收到后台。

   用手机浏览器打开时这个函数不会被调用，没有任何副作用。
   ──────────────────────────────────────────────────────────── */
window.__ledgerBack = function(){
  if($('askPop').classList.contains('is-on'))     { closeAsk();  return true; }
  if($('themePop').classList.contains('is-on'))   { $('themePop').classList.remove('is-on'); return true; }
  if($('sheetLayer').classList.contains('is-on')) { closeSheet(); return true; }

  const open = document.querySelector('.sub.is-on');
  if(open){ closeSub(open); return true; }

  if(curTab !== 'home'){ switchTab('home'); return true; }

  return false;
};


/* 给自动化测试用的后门，不影响使用 */
window.__ledger = {
  parseEntry, guessCat, CATS, QUOTES_BUILTIN, THEME_SPEC,
  greetWord, fmt, fmtShort, shiftMonthStr, monthText,
  get DB(){ return DB; },
  Store
};

</script>
